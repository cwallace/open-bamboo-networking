# Build a release distribution and create a draft GitHub Release.
#
# Mirrors the interim build.yml pipeline but with OBN_RELEASE=ON so the plugin
# reports the project version instead of a commit hash. Triggered manually so
# publishing the draft release and its tag cannot start a duplicate run.

name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0rc1)'
        required: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    name: Verify version tag
    runs-on: ubuntu-24.04
    outputs:
      abi-matrix: ${{ steps.list.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Determine tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Check tag matches version.hpp
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          HPP_VERSION=$(sed -n 's/.*OBN_PROJECT_VERSION "\([^"]*\)".*/\1/p' include/obn/version.hpp)
          if [ -z "$HPP_VERSION" ]; then
            echo "::error::Cannot parse OBN_PROJECT_VERSION from include/obn/version.hpp"
            exit 1
          fi
          if [ "$TAG" != "$HPP_VERSION" ]; then
            echo "::error::Tag '$TAG' does not match version in include/obn/version.hpp ('$HPP_VERSION')"
            exit 1
          fi
          echo "Version check passed: $TAG"

      - name: List ABI versions from abi_snapshot dirs
        id: list
        run: |
          VERSIONS=$(ls -d tools/abi_snapshot/v*/ \
            | sed 's|.*/v||; s|/$||' \
            | jq -Rnc '[inputs]')
          echo "matrix=$VERSIONS" >> "$GITHUB_OUTPUT"
          echo "Discovered ABI versions: $VERSIONS"

  build:
    name: v${{ matrix.abi }}.xx-linux-${{ matrix.arch }}
    needs: [preflight]
    runs-on: ${{ matrix.arch == 'x64' && 'ubuntu-24.04' || 'ubuntu-24.04-arm' }}
    strategy:
      fail-fast: false
      matrix:
        abi: ${{ fromJSON(needs.preflight.outputs.abi-matrix) }}
        arch:
          - x64
          - aarch64

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config ca-certificates git \
            libcjson-dev uthash-dev libcurl4-openssl-dev libssl-dev zlib1g-dev

      - name: Configure
        run: |
          ./configure \
            --build-type=Release \
            --enable-tests \
            --with-version='${{ matrix.abi }}.99' \
            --no-conf-patch \
            --cmake-arg=-DOBN_RELEASE=ON

      - name: Build
        run: make -j"$(nproc)"

      - name: Run tests
        run: make test

      - name: Verify built plugin exports every ABI symbol
        run: tools/check_abi_compat.sh --abi='${{ matrix.abi }}' --so=build/libbambu_networking.so

      - name: Stage artifacts
        run: |
          set -eu
          mkdir -p dist
          cp build/libbambu_networking.so dist/
          cp build/libBambuSource.so      dist/
          cp build/liblive555.so          dist/
          cp build/network_plugins.json   dist/
          ls -l dist/

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: obn-linux-v${{ matrix.abi }}.xx-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error

  build-windows:
    name: v${{ matrix.abi }}.xx-windows-x64
    needs: [preflight]
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        abi: ${{ fromJSON(needs.preflight.outputs.abi-matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $staging = Join-Path $env:GITHUB_WORKSPACE "install"
          New-Item -ItemType Directory -Force -Path $staging | Out-Null
          .\configure.ps1 `
            -ClientType bambu_studio `
            -WithVersion '${{ matrix.abi }}.99' `
            -Prefix $staging `
            -PatchConf:$false `
            -RegisterDShowFilter:$false `
            -EnableTests:$true
          # Re-run cmake to inject OBN_RELEASE into the existing build tree
          cmake build -DOBN_RELEASE=ON

      - name: Build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cmake --build build --config Release --parallel

      - name: Test (probe_plugin)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Push-Location build
          ctest -C Release --output-on-failure
          Pop-Location

      - name: Install
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cmake --install build --config Release

      - name: Stage artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $src = Join-Path $env:GITHUB_WORKSPACE "install"
          $dist = Join-Path $env:GITHUB_WORKSPACE 'dist'
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          Copy-Item -Path (Join-Path $src 'plugins\*') -Destination $dist -Force
          $ota = Join-Path $src 'ota'
          if (Test-Path $ota) {
            Copy-Item -Path $ota -Destination (Join-Path $dist 'ota') -Recurse -Force
          }
          Get-ChildItem -Recurse $dist | Format-Table FullName,Length -AutoSize

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: obn-v${{ matrix.abi }}.xx-windows-x64
          path: dist/
          if-no-files-found: error

  build-macos:
    name: v${{ matrix.abi }}.xx-macos-${{ matrix.arch }}
    needs: [preflight]
    runs-on: ${{ matrix.arch == 'arm64' && 'macos-15' || 'macos-15-intel' }}
    env:
      # Pin the toolchain so a runner-image update cannot silently raise the
      # deployment target of the distributed dylibs.
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    strategy:
      fail-fast: false
      matrix:
        abi: ${{ fromJSON(needs.preflight.outputs.abi-matrix) }}
        arch:
          - arm64
          - x64

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install build dependencies
        run: |
          set -eu
          for pkg in pkg-config cmake openssl@3 curl cjson zlib uthash; do
            brew list "$pkg" &>/dev/null || brew install "$pkg"
          done
          {
            echo "OPENSSL_ROOT_DIR=$(brew --prefix openssl@3)"
            PC="$(brew --prefix openssl@3)/lib/pkgconfig"
            PC="${PC}:$(brew --prefix curl)/lib/pkgconfig"
            PC="${PC}:$(brew --prefix zlib)/lib/pkgconfig"
            PC="${PC}:$(brew --prefix cjson)/lib/pkgconfig"
            echo "PKG_CONFIG_PATH=${PC}"
          } >> "$GITHUB_ENV"

      - name: Configure
        run: |
          ./configure \
            --build-type=Release \
            --enable-tests \
            --with-version='${{ matrix.abi }}.99' \
            --no-conf-patch \
            --cmake-arg=-DOBN_RELEASE=ON \
            --cmake-arg=-DCMAKE_OSX_DEPLOYMENT_TARGET=11.3

      - name: Build
        run: make -j"$(sysctl -n hw.ncpu)"

      - name: Verify macOS deployment target
        shell: bash
        run: |
          set -euo pipefail
          for library in build/*.dylib; do
            minos=$(otool -l "$library" | awk '
              /LC_BUILD_VERSION/ { in_build = 1; next }
              in_build && $1 == "minos" { print $2; exit }
            ')
            if [ "$minos" != "11.3" ]; then
              echo "::error file=$library::Expected macOS 11.3 deployment target, found ${minos:-none}"
              exit 1
            fi
            echo "$library: macOS $minos"
          done

      - name: Run tests
        run: make test

      - name: Verify built plugin exports every ABI symbol
        run: tools/check_abi_compat.sh --abi='${{ matrix.abi }}' --so=build/libbambu_networking.dylib

      - name: Stage artifacts
        run: |
          set -eu
          mkdir -p dist
          cp build/libbambu_networking.dylib dist/
          cp build/libBambuSource.dylib      dist/
          cp build/liblive555.dylib          dist/
          cp build/network_plugins.json      dist/
          ls -l dist/

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: obn-macos-${{ matrix.arch }}-v${{ matrix.abi }}.xx
          path: dist/
          if-no-files-found: error

  package:
    name: Package distributions
    needs: [build, build-windows, build-macos]
    runs-on: macos-15
    environment: macos-signing
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download all build artifacts
        uses: actions/download-artifact@v6
        with:
          path: artifacts/

      - name: Assemble distribution archives
        env:
          OBN_BUILD_TYPE: release
        run: scripts/package-dist.sh artifacts dist-out

      - name: Import Developer ID certificate
        shell: bash
        env:
          CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          CERTIFICATE_PATH="$RUNNER_TEMP/developer-id.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"

          if [ -z "$CERTIFICATE_BASE64" ] || [ -z "$CERTIFICATE_PASSWORD" ]; then
            echo "::error::macOS signing secrets are not configured"
            exit 1
          fi

          printf '%s' "$CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" \
            -P "$CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 \
            -k "$KEYCHAIN_PATH"
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

          SIGNING_IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
            | sed -n 's/.*"\(Developer ID Application:[^"]*\)".*/\1/p' \
            | head -n1)
          if [ -z "$SIGNING_IDENTITY" ]; then
            echo "::error::No Developer ID Application identity found in signing certificate"
            exit 1
          fi

          echo "SIGNING_IDENTITY=$SIGNING_IDENTITY" >> "$GITHUB_ENV"

      - name: Sign macOS libraries
        shell: bash
        run: |
          set -euo pipefail
          for stage_dir in dist-out/obn-macos-arm64 dist-out/obn-macos-x64; do
            if [ ! -d "$stage_dir" ]; then
              echo "::error::Missing macOS staging directory: $stage_dir"
              exit 1
            fi

            while IFS= read -r -d '' library; do
              codesign \
                --force \
                --options runtime \
                --timestamp \
                --sign "$SIGNING_IDENTITY" \
                "$library"
              codesign --verify --strict --verbose=2 "$library"
            done < <(find "$stage_dir" -type f -name '*.dylib' -print0)
          done

      - name: Create, notarize, and staple macOS disk images
        shell: bash
        env:
          NOTARY_APPLE_ID: ${{ secrets.APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.APPLE_NOTARY_APP_PASSWORD }}
          NOTARY_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          if [ -z "$NOTARY_APPLE_ID" ] || [ -z "$NOTARY_PASSWORD" ] || [ -z "$NOTARY_TEAM_ID" ]; then
            echo "::error::Apple notarization secrets are not configured"
            exit 1
          fi

          for arch in arm64 x64; do
            stage_dir="dist-out/obn-macos-$arch"
            disk_image="dist-out/obn-macos-$arch.dmg"

            rm -f "dist-out/obn-macos-$arch.tar.gz"
            tar -C dist-out -czf "dist-out/obn-macos-$arch.tar.gz" "obn-macos-$arch"

            hdiutil create \
              -volname "Open Bamboo Networking $arch" \
              -srcfolder "$stage_dir" \
              -ov \
              -format UDZO \
              "$disk_image"
            codesign \
              --force \
              --timestamp \
              --sign "$SIGNING_IDENTITY" \
              "$disk_image"
            codesign --verify --strict --verbose=2 "$disk_image"

            xcrun notarytool submit "$disk_image" \
              --apple-id "$NOTARY_APPLE_ID" \
              --password "$NOTARY_PASSWORD" \
              --team-id "$NOTARY_TEAM_ID" \
              --wait
            xcrun stapler staple "$disk_image"
            xcrun stapler validate "$disk_image"
            spctl --assess --verbose=4 \
              --type open \
              --context context:primary-signature \
              "$disk_image"
          done

      - name: Remove temporary signing keychain
        if: always()
        shell: bash
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          if [ -e "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH"
          fi
          rm -f "$RUNNER_TEMP/developer-id.p12"

      - name: Upload distribution archives
        uses: actions/upload-artifact@v6
        with:
          name: obn-distributions
          path: |
            dist-out/*.tar.gz
            dist-out/*.zip
            dist-out/*.dmg
          if-no-files-found: error

  release:
    name: Create draft release
    needs: [package]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download distribution archives
        uses: actions/download-artifact@v6
        with:
          name: obn-distributions
          path: dist-out/

      - name: Determine tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          gh release create "$TAG" \
            --draft \
            --title "$TAG" \
            --notes "Release $TAG" \
            dist-out/*.tar.gz dist-out/*.zip dist-out/*.dmg
